tools_allowlist:
  - git
  - gh
  - ao
  - cargo
  - rustup
  - node
  - npx
  - npm
  - pnpm
  - bash

mcp_servers:
  context7:
    command: npx
    args: ["-y", "@upstash/context7-mcp"]
  sequential-thinking:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
  github:
    command: npx
    args: ["-y", "gh-cli-mcp"]
  package-version:
    command: npx
    args: ["-y", "mcp-package-version"]
  filesystem:
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/Users/samishukri/ao-desktop"]
  playwright:
    command: npx
    args: ["-y", "@playwright/mcp", "--headless", "--isolated"]

agents:
  default:
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["ao", "context7", "filesystem"]
  implementation:
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["ao", "context7", "filesystem", "package-version", "playwright"]
  swe:
    model: claude-sonnet-4-6
    tool: claude
    mcp_servers: ["ao", "context7", "filesystem", "package-version", "playwright", "github"]
  em:
    model: claude-haiku-4-5
    tool: claude
    mcp_servers: ["ao", "sequential-thinking", "github", "filesystem"]
  po:
    model: claude-haiku-4-5
    tool: claude
    mcp_servers: ["ao", "context7", "sequential-thinking", "github", "filesystem"]
